[project]
name = "adrobot"
version = "1.0.0"
description = "Keitaro campaign creator and offer editor with persistent drafts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "pycountry>=24.6,<27",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
